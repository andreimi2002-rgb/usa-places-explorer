# Netlify build for America 360 (Next.js 16 via Netlify's OpenNext adapter, auto-installed).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # The public deploy serves the attributed seed snapshot (no hosted database yet).
  DATA_MODE = "fixture"
  NEXT_PUBLIC_LOCALE = "en"
  NEXT_TELEMETRY_DISABLED = "1"
