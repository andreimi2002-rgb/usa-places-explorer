# Local PostgreSQL + PostGIS for America 360 (development only).
# The defaults below are local development values, not secrets; override them in .env.
name: america360
services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-america360}
      POSTGRES_USER: ${POSTGRES_USER:-a360_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-a360_local_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - a360_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  a360_pgdata:
